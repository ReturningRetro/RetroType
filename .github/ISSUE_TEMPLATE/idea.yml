name: Idea or phone request
description: Suggest a feature, or a phone you'd love RetroType on.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are always welcome! It's just me building this, so I can't promise everything, but I read every one.
        Phone requests: Keyholders vote on which phone gets support next, so becoming one is the best way to push for yours.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of idea?
      options:
        - A new feature or change
        - A phone I'd like supported
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and how would it help you type?
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Which phone do you use?
